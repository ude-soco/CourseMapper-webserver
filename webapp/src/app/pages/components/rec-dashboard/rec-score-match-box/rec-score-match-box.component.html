<div
  class="border-[2px] rounded-[20px] p-5 mb-5 align-middle text-center"
  [style.border-color]="getScoreBackgroundColor(raw_score * 100)"
>
  <p class="m-0 p-0 italic">
    Recommended based on a
    <em
      [style.color]="getScoreBackgroundColor(raw_score * 100)"
      class="font-bold"
    >
      {{ raw_score * 100 | number: "1.0-2" }}%</em
    >

    match to your personal learner profile
  </p>

  <span class="flex gap-[3px] m-0 items-center justify-end p-0">
    <p
      class="font-medium underline mt-1 text-blue-600 hover:text-blue-700 cursor-pointer"
    >
      <a routerLink="/user/pkg">Modify my learner profile</a>
    </p>
    <i
      class="pi pi-info-circle text-gray-600 ml-[10px]"
      pTooltip="When you edit your personal learner profile, ALL the recommendations will be updated and so there is no guarantee that this course will still be recommended."
      tooltipPosition="top"
    ></i>
  </span>
</div>
