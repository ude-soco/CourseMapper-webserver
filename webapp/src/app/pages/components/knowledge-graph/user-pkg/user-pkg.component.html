<div *ngIf="loggedInUser$ | async as loggedInUser" class="flex flex-row w-full h-full">
  <!-- Site Sidebar -->
  <div><app-sidebar></app-sidebar></div>
  
  <!-- Main Content -->
  <div class="user-pkg-container">
    <!-- Header -->
    <div class="pkg-header">
      <div class="flex items-center gap-5">
        <app-back-button></app-back-button>
        <h2 class="text-xl font-semibold">Personal Knowledge Graph</h2>
      </div>
    </div>
    <hr />
  
  <!-- Graph Section -->
  <div class="graph-section">
    <!-- Loading State -->
    <div *ngIf="isLoading$ | async" class="loading-container">
      <p-progressSpinner></p-progressSpinner>
      <p>Loading your knowledge graph...</p>
    </div>
    
    <!-- Graph Visualization with Overlaid Controls -->
    <div *ngIf="(isLoading$ | async) === false && (rawConceptRecords$ | async)?.length" class="graph-wrapper">
      <!-- Filter Controls Component -->
      <app-pkg-filter-controls></app-pkg-filter-controls>
      
      <!-- Legend -->
      <div class="legend-container">
        <div class="flex items-center gap-5">

          <button 
            pButton 
            type="button" 
            label="Help"
            icon="pi pi-question-circle"
            class="p-button-text p-button-sm text-blue-600"
            pTooltip="Help & Instructions"
            title="Help & Instructions"
            tooltipPosition="top"
            (click)="openHelpDialog()">
          </button>
          
          <div class="flex items-center gap-5">
            <div *ngIf="showNotUnderstoodLegend" class="legend-item">
              <div class="legend-dot not-understood"></div>
              <span class="text-xs font-medium text-gray-700">Not Understood Concept</span>
            </div>
            <div *ngIf="showUnderstoodLegend" class="legend-item">
              <div class="legend-dot understood"></div>
              <span class="text-xs font-medium text-gray-700">Understood Concept</span>
            </div>
            <div *ngIf="showCourseLegend" class="legend-item">
              <div class="legend-dot course"></div>
              <span class="text-xs font-medium text-gray-700">Course Node</span>
            </div>
            <div *ngIf="showUserLegend" class="legend-item">
              <div class="legend-dot user"></div>
              <span class="text-xs font-medium text-gray-700">User Node</span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Graph Canvas -->
      <div class="graph-canvas">
        <app-cytoscape-pkg
          (conceptSelected)="onConceptSelected($event)"
          (conceptStatusChanged)="onConceptStatusChanged($event)"
          (courseNodeClicked)="onCourseNodeClicked($event)"
          (courseEngagementDashboardRequested)="onCourseEngagementDashboardRequested($event)"
          (courseViewRequested)="onCourseViewRequested($event)"
          (courseDetailsRequested)="onCourseDetailsRequested($event)"
          (edgeClicked)="onEdgeClicked($event)"
          (visibleNodesChanged)="onVisibleNodesChanged($event)">
        </app-cytoscape-pkg>
      </div>
      
      <!-- Concept Details Panel -->
      <app-pkg-concept-details-panel
        [visible]="showConceptDetails"
        [concept]="selectedConcept"
        [details]="conceptDetails"
        (close)="closeConceptDetails()">
      </app-pkg-concept-details-panel>

      <!-- Course Details Panel -->
      <app-pkg-course-details-panel
        [visible]="showCourseDetails"
        [courseNode]="selectedCourseNode"
        (close)="closeCourseDetails()"
        (viewCourse)="onCourseDetailsViewCourse($event)"
        (viewEngagementDashboard)="onCourseDetailsEngagementDashboard($event)">
      </app-pkg-course-details-panel>
      
      <!-- Help Dialog -->
      <app-graph-help-dialog
        [visible]="showHelpDialog"
        (close)="closeHelpDialog()">
      </app-graph-help-dialog>
    </div>

    <!-- Empty State -->
    <div *ngIf="(isLoading$ | async) === false && !(rawConceptRecords$ | async)?.length" class="empty-state">
      <i class="pi pi-info-circle text-4xl text-gray-400 mb-3"></i>
      <p class="text-gray-500">No knowledge graph data available. Start learning to build your graph!</p>
    </div>
  </div>
  </div>
</div>

<p-toast></p-toast>
