<div class="flex flex-col gap-4">
  <div>
    <label for="profileName" class="block text-sm font-medium text-gray-700 mb-2">
      Profile Name
    </label>
    <input
      id="profileName"
      type="text"
      pInputText
      [(ngModel)]="profileName"
      [placeholder]="placeholder"
      class="w-full"
      (keyup.enter)="save()"
      autofocus />
  </div>

  <div class="flex justify-end gap-2">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-text"
      (click)="cancel()">
    </button>
    <button
      pButton
      type="button"
      label="Save"
      class="p-button-primary"
      [disabled]="!profileName.trim()"
      (click)="save()">
    </button>
  </div>
</div>
