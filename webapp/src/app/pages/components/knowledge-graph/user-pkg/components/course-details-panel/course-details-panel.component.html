<div *ngIf="visible" 
     class="absolute top-0 right-0 h-full w-96 bg-white shadow-2xl z-20 overflow-hidden flex flex-col animate-slide-in border-l border-gray-200">
  
  <!-- Close Button -->
  <div class="flex justify-end p-4">
    <button 
      (click)="onClose()"
      aria-label="Close course details panel"
      title="Close"
      class="text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full p-2 transition-all duration-200">
      <i class="pi pi-times text-xl"></i>
    </button>
  </div>
  
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <i class="pi pi-spin pi-spinner text-4xl text-blue-600 mb-3"></i>
      <p class="text-gray-500">Loading course details...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="flex-1 flex items-center justify-center px-6">
    <div class="text-center">
      <i class="pi pi-exclamation-circle text-4xl text-red-500 mb-3"></i>
      <p class="text-gray-600">{{ error }}</p>
    </div>
  </div>
  
  <!-- Course Details Content -->
  <div *ngIf="courseDetails && !isLoading && !error" class="flex-1 overflow-y-auto px-6 pb-6">
    <!-- Course Name -->
    <h2 class="text-2xl font-bold text-gray-900 leading-tight">
      {{ courseDetails.name }}
    </h2>
    
    <!-- Course Description -->
    <p *ngIf="courseDetails.description" class="text-gray-600 mt-4 text-sm leading-relaxed">
      {{ courseDetails.description }}
    </p>
    
    <!-- View Course Link -->
    <a (click)="onViewCourse()" 
       class="text-blue-600 text-sm hover:underline mt-4 inline-flex items-center cursor-pointer">
      <span>View full course</span>
      <i class="pi pi-external-link ml-1"></i>
    </a>
  </div>
</div>
