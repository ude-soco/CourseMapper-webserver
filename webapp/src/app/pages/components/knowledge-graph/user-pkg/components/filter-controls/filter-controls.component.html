<!-- Top-Left: View Mode Controls -->
<div class="absolute top-6 left-6 z-10 bg-white rounded-xl shadow-lg p-3">
  <div class="flex flex-col gap-2.5">
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="knowledge" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('knowledge')"
        inputId="knowledge">
      </p-radioButton>
      <label for="knowledge" class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]">Knowledge State</label>
      
      <!-- Understanding Status Filter -->
      <div *ngIf="(viewMode$ | async) === 'knowledge'" class="flex items-center gap-2 ml-2">
        <label class="text-sm text-gray-500 whitespace-nowrap">Filter:</label>
        <p-dropdown 
          [options]="understandingStatusOptions" 
          [ngModel]="understandingStatus$ | async"
          (onChange)="onUnderstandingStatusChange($event.value)"
          [style]="{'border': '1px solid #d1d5db', 'border-radius': '6px', 'background': '#f9fafb', 'font-size': '14px', 'height': '36px', 'display': 'flex', 'align-items': 'center'}"
          [showClear]="false"
          placeholder="All">
        </p-dropdown>
      </div>
    </div>
    
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="interest" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('interest')"
        inputId="interest">
      </p-radioButton>
      <label for="interest" class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]">Interest Level</label>
    </div>
    
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="engagement" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('engagement')"
        inputId="engagement">
      </p-radioButton>
      <label for="engagement" class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]">Engagement Level</label>
    </div>
  </div>
</div>

<!-- Top-Right: Search and Filters -->
<div class="absolute top-6 right-6 z-10 flex flex-col gap-3">
  <!-- Search Bar and Advanced Filters -->
  <div class="flex items-center gap-3">
    <div class="bg-white rounded-xl shadow-lg px-4 h-10 flex items-center">
      <i class="pi pi-search text-gray-400 text-sm mr-2"></i>
      <input 
        type="text" 
        #searchInput
        [ngModel]="searchQuery$ | async"
        (ngModelChange)="onSearchQueryChange($event)"
        placeholder="Search for concepts"
        class="search-input w-48 border-0 outline-none text-sm" />
    </div>
    <button 
      pButton 
      type="button"
      [label]="hasActiveFilters ? 'Clear Filters' : 'Advanced Filters'"
      [icon]="hasActiveFilters ? 'pi pi-times' : 'pi pi-filter'"
      class="p-button-sm"
      [ngClass]="{'p-button-warning': hasActiveFilters}"
      (click)="hasActiveFilters ? clearAdvancedFilters() : openAdvancedFilters()">
    </button>
  </div>
  
  <!-- Top-N Dropdown -->
  <div class="flex justify-end">
    <div class="bg-white rounded-xl shadow-lg px-4 h-10 flex items-center gap-2">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap">Top-N Main Concepts</label>
      <p-dropdown 
        [options]="topNOptions" 
        [ngModel]="topNConcepts$ | async"
        (onChange)="onTopNChange($event.value)"
        [style]="{'border': '1px solid #d1d5db', 'border-radius': '6px', 'background': '#f9fafb', 'font-size': '14px', 'height': '40px', 'display': 'flex', 'align-items': 'center'}"
        appendTo="body">
      </p-dropdown>
    </div>
  </div>
</div>
