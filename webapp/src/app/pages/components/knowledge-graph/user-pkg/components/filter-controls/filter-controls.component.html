<!-- Top-Left: View Mode Controls -->
<div class="absolute top-6 left-6 z-10 bg-white rounded-xl shadow-lg p-3">
  <div class="flex flex-col gap-2.5">
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="knowledge" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('knowledge')"
        inputId="knowledge">
      </p-radioButton>
      <label for="knowledge" 
             class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]"
             pTooltip="View concepts based on your understanding status"
             tooltipPosition="right">Knowledge State</label>
      
      <!-- Understanding Status Filter - Only shows for Knowledge State view -->
      <div *ngIf="(viewMode$ | async) === 'knowledge'" class="flex items-center gap-2 ml-2">
        <label class="text-sm font-medium text-gray-700 whitespace-nowrap"></label>
        <p-dropdown 
          [options]="understandingStatusOptions" 
          [ngModel]="understandingStatus$ | async"
          (onChange)="onUnderstandingStatusChange($event.value)"
          optionLabel="label"
          optionValue="value"
          [style]="{'border': '1px solid #d1d5db', 'border-radius': '6px', 'background': '#f9fafb', 'font-size': '14px', 'height': '36px', 'display': 'flex', 'align-items': 'center'}"
          [showClear]="false"
          placeholder="All Concepts"
          pTooltip="Filter by understanding status"
          tooltipPosition="bottom">
          <ng-template let-option pTemplate="item">
            <div class="flex items-center gap-2">
              <i [class]="option.icon" 
                 [ngClass]="{
                   'text-green-600': option.value === 'u',
                   'text-red-600': option.value === 'dnu',
                   'text-gray-500': option.value === 'all'
                 }"></i>
              <span>{{ option.label }}</span>
            </div>
          </ng-template>
          <ng-template let-option pTemplate="selectedItem">
            <div class="flex items-center gap-2">
              <i [class]="option.icon" 
                 [ngClass]="{
                   'text-green-600': option.value === 'u',
                   'text-red-600': option.value === 'dnu',
                   'text-gray-500': option.value === 'all'
                 }"></i>
              <span>{{ option.label }}</span>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
    </div>
    
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="interest" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('interest')"
        inputId="interest">
      </p-radioButton>
      <label for="interest" 
             class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]"
             pTooltip="View concepts based on your interest level"
             tooltipPosition="right">Interest Level</label>
    </div>
    
    <div class="flex items-center gap-3 min-h-[36px]">
      <p-radioButton 
        name="viewMode" 
        value="engagement" 
        [ngModel]="viewMode$ | async"
        (onClick)="onViewModeChange('engagement')"
        inputId="engagement">
      </p-radioButton>
      <label for="engagement" 
             class="cursor-pointer text-sm font-medium text-gray-700 min-w-[110px]"
             pTooltip="View your engagement level with each course"
             tooltipPosition="right">Engagement Level</label>
    </div>
  </div>
</div>

<!-- Top-Right: Search and Filters -->
<div *ngIf="(viewMode$ | async) !== 'engagement'" class="absolute top-6 right-6 z-10 flex flex-col gap-3">
    <!-- Search Bar and Advanced Filters -->
  <div class="flex items-center gap-3">
    <div class="bg-white rounded-xl shadow-lg px-4 h-10 flex items-center"
         pTooltip="Search concepts by name"
         tooltipPosition="bottom">
      <i class="pi pi-search text-gray-400 text-sm mr-2"></i>
      <input 
        type="text" 
        #searchInput
        [ngModel]="searchQuery$ | async"
        (ngModelChange)="onSearchQueryChange($event)"
        placeholder="Search for Concepts"
        class="search-input w-48 border-0 outline-none text-sm" />
    </div>
    <!-- Only show Filters button for Knowledge State view -->
    <button 
      *ngIf="(viewMode$ | async) === 'knowledge'"
      pButton 
      type="button"
      [label]="hasActiveFilters ? 'Clear Filters' : 'Filters'"
      [icon]="hasActiveFilters ? 'pi pi-times' : 'pi pi-filter'"
      class="p-button-sm"
      [ngClass]="{'p-button-danger': hasActiveFilters}"
      (click)="hasActiveFilters ? clearAdvancedFilters() : openAdvancedFilters()"
      [pTooltip]="hasActiveFilters ? 'Clear active filters' : 'Filter by courses, materials, and slides'"
      tooltipPosition="bottom">
    </button>
  </div>

  <!-- Active Filter Badge -->
  <div *ngIf="activeProfileName && (viewMode$ | async) === 'knowledge'" 
       class="bg-white rounded-xl shadow-lg px-4 py-2.5 flex items-center justify-between gap-3 cursor-help"
       [pTooltip]="activeProfileTooltip"
       tooltipPosition="left"
       [escape]="false"
       [tooltipOptions]="{tooltipStyleClass: 'profile-tooltip'}">
    <div class="flex items-center gap-2">
      <i class="pi pi-filter text-blue-600 text-base"></i>
      <span class="text-sm font-semibold text-blue-600">{{ activeProfileName }}</span>
    </div>
    <span class="text-xs font-medium text-blue-600 px-2.5 py-1 bg-blue-50 rounded-full whitespace-nowrap">
      {{ activeProfileSlideCount }} slides
    </span>
  </div>
  
  <!-- Top-N Dropdown - For Knowledge State -->
  <div *ngIf="(viewMode$ | async) === 'knowledge'" class="flex justify-end">
    <div class="bg-white rounded-xl shadow-lg px-4 h-10 flex items-center gap-2">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap">Top-N Main Concepts</label>
      <p-dropdown 
        [options]="topNOptions" 
        [ngModel]="topNConcepts$ | async"
        (onChange)="onTopNChange($event.value)"
        [style]="{'border': '1px solid #d1d5db', 'border-radius': '6px', 'background': '#f9fafb', 'font-size': '14px', 'height': '40px', 'display': 'flex', 'align-items': 'center'}"
        appendTo="body"
        pTooltip="Limit results based on concept importance to learning material"
        tooltipPosition="bottom">
      </p-dropdown>
    </div>
  </div>
  
  <!-- Top-N Dropdown - For Interest Level view -->
  <div *ngIf="(viewMode$ | async) === 'interest'" class="flex justify-end">
    <div class="bg-white rounded-xl shadow-lg px-4 h-10 flex items-center gap-2">
      <label class="text-sm font-medium text-gray-700 whitespace-nowrap">Top-N Main Concepts</label>
      <p-dropdown 
        [options]="topNOptions" 
        [ngModel]="topNConcepts$ | async"
        (onChange)="onTopNChange($event.value)"
        [style]="{'border': '1px solid #d1d5db', 'border-radius': '6px', 'background': '#f9fafb', 'font-size': '14px', 'height': '40px', 'display': 'flex', 'align-items': 'center'}"
        appendTo="body"
        pTooltip="Limit results based on highest interest scores"
        tooltipPosition="bottom">
      </p-dropdown>
    </div>
  </div>
</div>
